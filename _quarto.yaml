format:
  pdf:
    include-in-header:
      text: |
        \usepackage{amsmath}
        
        \usepackage{mdframed}
        \newmdenv[
          linewidth=0.75pt,
          linecolor=black,
          innerleftmargin=8pt,
          innerrightmargin=8pt,
          innertopmargin=8pt,
          innerbottommargin=8pt
        ]{mybox}

        \usepackage{fancyhdr}
        \fancypagestyle{startHeader} {
          \fancyhead[C]{ }
        }

    pdf-engine: xelatex
    geometry:
      - margin=1in

filters:
  - filter.lua

execute:
  echo: false